<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fff"/>
      <stop offset="50%" style="stop-color:#ff6bac"/>
      <stop offset="100%" style="stop-color:#00e5b0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>
  <!-- C letter -->
  <text x="8" y="44" font-family="Arial Black, sans-serif" font-weight="900" font-size="38" fill="white">C</text>
  <!-- Lightning bolt -->
  <text x="36" y="30" font-family="Arial" font-size="22" fill="#fbbf24">⚡</text>
  <!-- Bottom accent -->
  <rect x="10" y="50" width="44" height="3" rx="1.5" fill="white" opacity="0.35"/>
</svg>
